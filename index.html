<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAF-VX | الموقع قيد الصيانة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050203;
            --card-bg: rgba(25, 10, 12, 0.75);
            --card-border: rgba(255, 26, 64, 0.3);
            --accent-gradient: linear-gradient(135deg, #ff1a40 0%, #990012 100%);
            --text-main: #ffffff;
            --text-muted: #c5b4bc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(255, 26, 64, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(153, 0, 18, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 25px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 26, 64, 0.15);
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 26, 64, 0.4);
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 171, 0, 0.12);
            border: 1px solid rgba(255, 171, 0, 0.3);
            color: #ffc107;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .message {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .sub-message {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .footer-note {
            font-size: 0.8rem;
            color: rgba(197, 180, 188, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="brand-title">𝐑𝐀𝐅𝐕𝐗</div>
        <div class="status-badge">🛠️ الموقع قيد التطوير والتحديث</div>
        
        <div class="message">نرجو الانتظار لمدة يومين تقريباً...</div>
        <div class="sub-message">
            نقوم حالياً بإجراء تحديثات وتحسينات جذرية على المنصة وربط الصور لتظهر بأفضل شكل ممكن. ترقبونا قريباً للإصدار الملكي بحلة جديدة!
        </div>

        <div class="footer-note">
            جميع الحقوق محفوظة منصة <strong>RAF-VX</strong> © 2026
        </div>
    </div>

</body>
</html>
