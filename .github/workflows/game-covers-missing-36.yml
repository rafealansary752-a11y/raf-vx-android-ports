name: RAF-VX Missing 36 Covers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raf-vx-missing-covers
  cancel-in-progress: false

jobs:
  missing-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RAF-VX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download covers for the 36 missing games only
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, time, unicodedata
          from pathlib import Path
          from urllib.parse import quote
          from io import BytesIO
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          ROOT = Path.cwd()
          HTML = ROOT / "index.html"
          OUT = ROOT / "images" / "games"
          API = "https://www.steamgriddb.com/api/v2"
          KEY = os.environ.get("STEAMGRIDDB_API_KEY", "").strip()

          # These are the only card numbers this workflow is allowed to change.
          TARGETS = {
              1: ["Fable II", "Fable 2"],
              9: ["Devil May Cry 3: Special Edition", "Devil May Cry 3"],
              20: ["Uncharted: The Nathan Drake Collection", "Uncharted Collection"],
              21: ["Max Payne 2: The Fall of Max Payne", "Max Payne 2"],
              23: ["Pro Evolution Soccer 5", "PES 5"],
              24: ["Grand Theft Auto V", "GTA 5"],
              25: ["Call of Duty 4: Modern Warfare", "Call of Duty 4"],
              30: ["Resident Evil 4", "Resident Evil 4 (2005)"],
              31: ["FIFA Street 2", "FIFA Street 2012"],
              32: ["Sekiro: Shadows Die Twice", "Sekiro"],
              35: ["Call of Duty: Black Ops II", "Call of Duty: Black Ops 2"],
              37: ["Resident Evil 7: Biohazard", "Resident Evil 7"],
              38: ["Metal Gear Solid 2: Sons of Liberty", "Metal Gear Solid 2"],
              40: ["Naruto Shippuden: Ultimate Ninja Storm Revolution", "Naruto Shippuden Ultimate Ninja Storm Revolution"],
              46: ["Mortal Kombat (2011)", "Mortal Kombat 9"],
              48: ["Need for Speed: Most Wanted (2005)", "Need for Speed: Most Wanted"],
              51: ["Grand Theft Auto IV", "GTA IV"],
              52: ["Forza Horizon"],
              53: ["Naruto Shippuden: Ultimate Ninja Storm Generations", "Naruto Storm Generations"],
              54: ["Bloodborne"],
              55: ["Naruto Shippuden: Ultimate Ninja Storm 3", "Naruto Shippuden: Ultimate Ninja Storm 2"],
              56: ["Need for Speed: Most Wanted (2012)", "Need for Speed: Most Wanted"],
              59: ["Pro Evolution Soccer 2017", "PES 2017"],
              62: ["Scarface: The World Is Yours", "Scarface"],
              63: ["Crash Team Racing Nitro-Fueled", "Crash Team Racing"],
              64: ["Doom (2016)", "DOOM"],
              65: ["Gothic"],
              72: ["Sonic & All-Stars Racing Transformed", "Sonic & Sega All-Stars Racing"],
              84: ["WWE 2K14"],
              90: ["Nazi Zombies: Portable", "Nazi Zombies Portable"],
              96: ["Poppy Playtime", "Poppy Playtime Chapter 5"],
              98: ["Far Cry"],
              107: ["Aura Farming"],
              108: ["Rodland of Pipes", "Rodland"],
              110: ["Blasphemous 2"],
              113: ["The Godfather (2006)", "The Godfather"]
          }

          if not KEY:
              raise SystemExit("Missing repository secret: STEAMGRIDDB_API_KEY")
          if not HTML.exists():
              raise SystemExit("index.html was not found.")

          def norm(value):
              value = unicodedata.normalize("NFKD", value or "")
              value = "".join(ch for ch in value if not unicodedata.combining(ch))
              value = value.casefold().replace("&", " and ")
              value = re.sub(r"[^a-z0-9]+", " ", value)
              return " ".join(value.split())

          session = requests.Session()
          session.headers.update({
              "Authorization": f"Bearer {KEY}",
              "User-Agent": "RAF-VX-MissingCoverBot/1.0"
          })

          def api_get(url):
              response = session.get(url, timeout=35)
              if response.status_code == 429:
                  time.sleep(4)
                  response = session.get(url, timeout=35)
              response.raise_for_status()
              payload = response.json()
              if not payload.get("success", False):
                  raise RuntimeError("SteamGridDB returned an unsuccessful response")
              return payload.get("data", [])

          soup = BeautifulSoup(HTML.read_text(encoding="utf-8"), "html.parser")
          cards = soup.select(".game-card")
          if len(cards) < 113:
              raise SystemExit(f"Expected at least 113 game cards, found {len(cards)}. Stopping safely.")

          OUT.mkdir(parents=True, exist_ok=True)
          downloaded, kept, missing, errors = [], [], [], []

          for number, candidates in TARGETS.items():
              card = cards[number - 1]
              title_el = card.select_one(".game-title")
              title = title_el.get_text(" ", strip=True) if title_el else f"Game #{number}"
              title = re.sub(r"^[✨⭐🎮]+\s*", "", title).strip()
              box = card.select_one(".game-title-box")
              if box is None:
                  missing.append(f"#{number} {title}: cover container missing")
                  continue

              existing_files = list(OUT.glob(f"{number:03d}.*"))
              existing_img = box.select_one("img.game-cover-img")
              if existing_files:
                  if not existing_img:
                      img = soup.new_tag(
                          "img",
                          src=existing_files[0].relative_to(ROOT).as_posix(),
                          alt=title,
                          **{"class": "game-cover-img", "loading": "lazy", "decoding": "async"}
                      )
                      box.clear()
                      box.append(img)
                      box["class"] = list(set((box.get("class") or []) + ["has-cover"]))
                  kept.append(f"#{number} {title}: local cover already exists")
                  continue

              if existing_img:
                  # Never replace an image that is already attached to this card.
                  kept.append(f"#{number} {title}: image already attached")
                  continue

              try:
                  found_game = None
                  for candidate in candidates:
                      results = api_get(f"{API}/search/autocomplete/{quote(candidate, safe='')}")
                      exact = [g for g in results if norm(g.get("name", "")) == norm(candidate)]
                      if exact:
                          exact.sort(key=lambda g: (not bool(g.get("verified")), g.get("id", 0)))
                          found_game = exact[0]
                          break
                      time.sleep(0.15)

                  if not found_game:
                      missing.append(f"#{number} {title}: no exact SteamGridDB title match")
                      continue

                  grids = api_get(
                      f"{API}/grids/game/{found_game['id']}?dimensions=600x900&types=static&nsfw=false&humor=false"
                  )
                  if not grids:
                      missing.append(f"#{number} {title}: no safe static portrait cover")
                      continue

                  grids.sort(key=lambda g: (not bool(g.get("verified", False)), -(g.get("score") or 0)))
                  image_url = grids[0].get("url")
                  if not image_url:
                      missing.append(f"#{number} {title}: cover URL missing")
                      continue

                  response = requests.get(
                      image_url, timeout=45,
                      headers={"User-Agent": "RAF-VX-MissingCoverBot/1.0"}
                  )
                  response.raise_for_status()
                  if len(response.content) > 12 * 1024 * 1024:
                      raise RuntimeError("cover exceeds 12 MB")

                  image = Image.open(BytesIO(response.content))
                  image.verify()
                  fmt = (image.format or "").upper()
                  ext = {"JPEG": ".jpg", "PNG": ".png", "WEBP": ".webp"}.get(fmt)
                  if not ext:
                      raise RuntimeError(f"unsupported image format: {fmt}")

                  image_path = OUT / f"{number:03d}{ext}"
                  image_path.write_bytes(response.content)

                  img = soup.new_tag(
                      "img",
                      src=image_path.relative_to(ROOT).as_posix(),
                      alt=title,
                      **{"class": "game-cover-img", "loading": "lazy", "decoding": "async"}
                  )
                  box.clear()
                  box.append(img)
                  box["class"] = list(set((box.get("class") or []) + ["has-cover"]))
                  downloaded.append(f"#{number} {title}")
              except Exception as exc:
                  errors.append(f"#{number} {title}: {type(exc).__name__}: {exc}")

              time.sleep(0.25)

          style = """
          /* RAF-VX local game covers */
          .game-title-box.has-cover { padding: 0 !important; overflow: hidden; background: #090b10; }
          .game-title-box .game-cover-img { display: block; width: 100%; height: 100%; min-height: 140px; object-fit: cover; border-radius: 13px; }
          @media (max-width: 767px) { .game-title-box.has-cover { width: 104px; height: 140px; min-width: 104px; } }
          @media (min-width: 768px) { .game-title-box.has-cover { width: 120px; height: 140px; min-width: 120px; } }
          """
          styles = soup.find_all("style")
          if styles and "RAF-VX local game covers" not in styles[0].get_text():
              styles[0].append(style)

          HTML.write_text(str(soup), encoding="utf-8")

          report = [
              f"Target games: {len(TARGETS)}",
              f"New covers downloaded: {len(downloaded)}",
              f"Existing covers left untouched: {len(kept)}",
              f"Still without a confirmed cover: {len(missing)}",
              f"Errors: {len(errors)}",
          ]
          if downloaded:
              report += ["", "### Downloaded"] + ["- " + x for x in downloaded]
          if kept:
              report += ["", "### Kept unchanged"] + ["- " + x for x in kept]
          if missing:
              report += ["", "### Needs manual review"] + ["- " + x for x in missing]
          if errors:
              report += ["", "### Errors"] + ["- " + x for x in errors]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Commit only generated cover changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/games
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add covers for remaining RAF-VX games"
            git push
          fi
