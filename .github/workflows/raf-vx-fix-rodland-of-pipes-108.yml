name: RAF-VX Fix Original Rodland of Pipes Cover 108

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raf-vx-fix-original-cover-108
  cancel-in-progress: false

jobs:
  fix-rodland-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout RAF-VX
        uses: actions/checkout@v4

      - name: Install image validation packages
        run: python -m pip install --upgrade pillow beautifulsoup4

      - name: Download original Rodland of Pipes cover
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          from bs4 import BeautifulSoup
          from urllib.request import Request, urlopen
          import os

          root = Path.cwd()
          html_path = root / "index.html"
          image_dir = root / "images" / "games"
          image_path = image_dir / "108.jpg"

          # Exact Steam app ID for Rodland of Pipes.
          # This is the same official Steam library artwork URL that succeeded
          # in the previous run (300x450 portrait image).
          url = (
              "https://shared.steamstatic.com/store_item_assets/steam/apps/"
              "3125120/library_600x900.jpg"
          )

          if not html_path.is_file():
              raise SystemExit("ERROR: index.html not found; no files changed.")

          request = Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 RAF-VX original cover importer"}
          )
          with urlopen(request, timeout=40) as response:
              data = response.read()

          if not data or len(data) > 15 * 1024 * 1024:
              raise SystemExit("ERROR: image is empty or unexpectedly large.")

          image = Image.open(BytesIO(data))
          image.verify()
          image = Image.open(BytesIO(data))
          width, height = image.size
          if width < 250 or height < 350 or height <= width:
              raise SystemExit(
                  f"ERROR: unexpected cover dimensions {width}x{height}; "
                  "expected a valid portrait cover."
              )

          soup = BeautifulSoup(html_path.read_text(encoding="utf-8"), "html.parser")
          cards = soup.select(".game-card")
          if len(cards) < 108:
              raise SystemExit(
                  f"ERROR: found only {len(cards)} game cards; expected at least 108."
              )

          box = cards[107].select_one(".game-title-box")
          if box is None:
              raise SystemExit("ERROR: game #108 cover container not found.")

          image_dir.mkdir(parents=True, exist_ok=True)
          image_path.write_bytes(data)

          img = box.select_one("img.game-cover-img")
          if img is None:
              img = soup.new_tag(
                  "img",
                  **{
                      "class": "game-cover-img",
                      "loading": "lazy",
                      "decoding": "async",
                  }
              )
              box.clear()
              box.append(img)

          img["src"] = "images/games/108.jpg"
          img["alt"] = "Rodland of Pipes"
          classes = box.get("class", [])
          if "has-cover" not in classes:
              classes.append("has-cover")
          box["class"] = classes

          html_path.write_text(str(soup), encoding="utf-8")

          report = (
              "### Rodland of Pipes #108 cover fixed\n"
              f"- Result: original Steam library artwork downloaded successfully ({width}x{height}).\n"
              f"- Source: {url}\n"
              "- Game #107 and all other game cards were left unchanged.\n"
          )
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          PY

      - name: Commit only game 108 cover and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/games/108.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix original Rodland of Pipes cover for game 108"
            git push
          fi
