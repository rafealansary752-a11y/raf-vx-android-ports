name: RAF-VX - Add Game Covers 114 and 115

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create cover images
        run: |
          python -m pip install --quiet pillow
          mkdir -p images/games
          cat > /tmp/create_covers.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import random, math, os

          W = H = 1200
          def font(size):
              for p in [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
              ]:
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default()

          def cover(path, title, subtitle, top, bottom, accent, seed):
              random.seed(seed)
              im = Image.new("RGB", (W,H))
              pix = im.load()
              for y in range(H):
                  t = y/(H-1)
                  c = tuple(int(top[i]*(1-t)+bottom[i]*t) for i in range(3))
                  for x in range(W): pix[x,y] = c
              glow = Image.new("RGBA",(W,H),(0,0,0,0))
              gd = ImageDraw.Draw(glow)
              for _ in range(12):
                  x=random.randint(80,1120); y=random.randint(100,900); r=random.randint(90,260)
                  gd.ellipse((x-r,y-r,x+r,y+r), fill=(*accent,random.randint(12,35)))
              glow=glow.filter(ImageFilter.GaussianBlur(55))
              im=Image.alpha_composite(im.convert("RGBA"),glow)
              d=ImageDraw.Draw(im)
              cx,cy=600,470
              for r,a in [(310,35),(245,55),(175,75),(105,100)]:
                  d.ellipse((cx-r,cy-r,cx+r,cy+r), outline=(*accent,a), width=10)
              for _ in range(60):
                  x=random.randint(50,1150); y=random.randint(100,900)
                  d.line((x,y,x+random.randint(-90,90),y-random.randint(25,150)),
                         fill=(*accent,random.randint(60,180)),width=random.randint(2,7))
              d.rounded_rectangle((45,855,1155,1155),radius=42,fill=(5,9,20,225),outline=(*accent,230),width=5)
              f=font(66)
              lines=title.split("|")
              yy=875
              for line in lines:
                  box=d.textbbox((0,0),line,font=f)
                  d.text(((W-(box[2]-box[0]))/2,yy),line,font=f,fill=(255,255,255,255),
                         stroke_width=2,stroke_fill=(0,0,0,230))
                  yy+=82
              sf=font(28); box=d.textbbox((0,0),subtitle,font=sf)
              d.text(((W-(box[2]-box[0]))/2,1100),subtitle,font=sf,fill=(*accent,255))
              im.convert("RGB").save(path,"JPEG",quality=94,optimize=True)

          cover("images/games/114.jpg","DRAGON BALL:|SPARKING! ZERO",
                "RAF-VX  •  GAME #114",(12,28,62),(35,8,20),(255,181,55),114)
          cover("images/games/115.jpg","NARUTO SHIPPUDEN:|ULTIMATE NINJA STORM 4",
                "RAF-VX  •  GAME #115",(30,16,54),(8,28,45),(255,125,55),115)
          PY
          python /tmp/create_covers.py

      - name: Commit covers to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/games/114.jpg images/games/115.jpg
          if git diff --cached --quiet; then
            echo "No cover changes to commit."
            exit 0
          fi
          git commit -m "Add game covers 114 and 115"
          git push
