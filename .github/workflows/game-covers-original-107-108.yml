name: RAF-VX Original Covers 107 and 108

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raf-vx-original-covers-107-108
  cancel-in-progress: false

jobs:
  original-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout RAF-VX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download original Steam library covers for exact app IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image
          from bs4 import BeautifulSoup
          import os

          ROOT = Path.cwd()
          HTML = ROOT / "index.html"
          OUT = ROOT / "images" / "games"

          # Official Steam app IDs:
          # Aura Farming = 4754800
          # Rodland of Pipes = 3125120
          TARGETS = {
              107: ("Aura Farming", 4754800),
              108: ("Rodland of Pipes", 3125120),
          }

          if not HTML.exists():
              raise SystemExit("index.html missing; stopping safely.")

          soup = BeautifulSoup(HTML.read_text(encoding="utf-8"), "html.parser")
          cards = soup.select(".game-card")
          if len(cards) < 113:
              raise SystemExit(f"Expected at least 113 game cards; found {len(cards)}.")

          OUT.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent": "RAF-VX-Official-Steam-Cover-Importer/1.0"})
          added, errors = [], []

          for number, (title, appid) in TARGETS.items():
              try:
                  card = cards[number - 1]
                  box = card.select_one(".game-title-box")
                  if box is None:
                      raise RuntimeError("game cover container missing")

                  # Steam's official vertical library artwork for this exact app ID.
                  url = f"https://cdn.akamai.steamstatic.com/steam/apps/{appid}/library_600x900.jpg"
                  response = session.get(url, timeout=40)
                  response.raise_for_status()
                  if len(response.content) > 12 * 1024 * 1024:
                      raise RuntimeError("image exceeds 12 MB")

                  im = Image.open(BytesIO(response.content))
                  im.verify()
                  im = Image.open(BytesIO(response.content)).convert("RGB")
                  if im.width < 250 or im.height < 350 or im.height <= im.width:
                      raise RuntimeError(f"not a valid portrait cover: {im.width}x{im.height}")

                  target = OUT / f"{number:03d}.jpg"
                  im.save(target, "JPEG", quality=94, optimize=True)

                  img = box.select_one("img.game-cover-img")
                  if img is None:
                      img = soup.new_tag(
                          "img",
                          **{"class": "game-cover-img", "loading": "lazy", "decoding": "async"}
                      )
                      box.clear()
                      box.append(img)
                  img["src"] = target.relative_to(ROOT).as_posix()
                  img["alt"] = title
                  box["class"] = list(set((box.get("class") or []) + ["has-cover"]))
                  added.append(f"#{number} {title}: original Steam library artwork ({im.width}x{im.height})")
              except Exception as exc:
                  errors.append(f"#{number} {title}: {type(exc).__name__}: {exc}")

          HTML.write_text(str(soup), encoding="utf-8")
          report = [
              "### Original Steam covers",
              f"Downloaded: {len(added)}",
              f"Errors: {len(errors)}",
              "",
              "### Added",
              *["- " + x for x in added],
              "",
              "### Errors",
              *["- " + x for x in errors],
              "",
              "Game #90 was intentionally not modified by this workflow."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Commit only images 107 and 108 and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/games/107.jpg images/games/108.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add original Steam covers for RAF-VX games 107 and 108"
            git push
          fi
