name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download WebIntoApp / Simple Build Tool
        run: |
          mkdir -p build-env
          cd build-env
          cat << 'EOF' > build.py
          import os
          print("Preparing RAFX WebApp Build...")
          os.system("mkdir -p app/src/main/assets")
          print("Structure ready.")
          EOF
          python3 build.py

      - name: Build Simple APK
        run: |
          echo "Simulating final APK packaging..."
          mkdir -p output
          echo "Dummy APK for RAFX" > output/RAFX-App.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAFX-App
          path: output/RAFX-App.apk
