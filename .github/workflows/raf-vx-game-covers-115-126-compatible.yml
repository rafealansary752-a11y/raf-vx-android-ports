name: RAF-VX - Download and Connect Game Covers 115-126

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raf-vx-game-covers-115-126
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download covers and connect them to RAF-VX cards
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, time, unicodedata
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from difflib import SequenceMatcher

          # Names are taken from RAF-VX 12.1.9 card titles.
          GAMES = [
              (115, "NARUTO SHIPPUDEN Ultimate Ninja STORM 4"),
              (116, "Divinity Original Sin 2"),
              (117, "Minecraft Dungeons II"),
              (118, "Forza Motorsport 2005"),
              (119, "Charlie Murder"),
              (120, "Hearts of Iron IV"),
              (121, "Land of the Dead Road to Fiddlers Green"),
              (122, "Darkwatch"),
              (123, "Dark Souls 2 Scholar of the First Sin"),
              (124, "Untitled Goose Game"),
              (125, "Hamburger Hill"),
              (126, "Super Mario Strikers"),
          ]

          HTML = Path("index.html")
          OUT = Path("images/games")
          OUT.mkdir(parents=True, exist_ok=True)
          if not HTML.exists():
              raise SystemExit("index.html was not found at the repository root.")

          def norm(s):
              s = unicodedata.normalize("NFKD", s or "")
              s = "".join(c for c in s if not unicodedata.combining(c))
              s = s.lower().replace("&", "and")
              return re.sub(r"[^a-z0-9]+", " ", s).strip()

          def score(a, b):
              return SequenceMatcher(None, norm(a), norm(b)).ratio()

          def get_json(url, headers=None):
              h = {"User-Agent": "RAF-VX-CoverBot/2.0"}
              if headers:
                  h.update(headers)
              req = Request(url, headers=h)
              with urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          def download(url, dest):
              req = Request(url, headers={"User-Agent": "RAF-VX-CoverBot/2.0"})
              with urlopen(req, timeout=45) as r:
                  data = r.read()
                  ctype = r.headers.get("Content-Type", "").lower()
              valid = data.startswith(b"\xff\xd8") or data.startswith(b"\x89PNG") or data[:4] == b"RIFF"
              if len(data) < 5000 or not valid or "html" in ctype:
                  raise ValueError("Source did not return a valid image.")
              dest.write_bytes(data)

          def steamgriddb_image(title):
              key = os.environ.get("STEAMGRIDDB_API_KEY")
              if not key:
                  return None
              headers = {"Authorization": "Bearer " + key}
              data = get_json(
                  "https://www.steamgriddb.com/api/v2/search/autocomplete/" + quote(title),
                  headers
              )
              candidates = sorted(data.get("data", []), key=lambda x: score(title, x.get("name", "")), reverse=True)
              for item in candidates[:6]:
                  if score(title, item.get("name", "")) < 0.78:
                      continue
                  grids = get_json(
                      f"https://www.steamgriddb.com/api/v2/grids/game/{item['id']}?dimensions=600x900",
                      headers
                  ).get("data", [])
                  # Prefer portrait artwork; avoid logos and wide banners.
                  grids = [g for g in grids if g.get("url") and
                           (not g.get("width") or not g.get("height") or g["height"] >= g["width"])]
                  if grids:
                      return grids[0]["url"], "SteamGridDB", item.get("name", "")
              return None

          def steam_image(title):
              data = get_json("https://store.steampowered.com/api/storesearch/?term=" + quote(title) + "&l=english&cc=US")
              items = sorted(data.get("items", []), key=lambda x: score(title, x.get("name", "")), reverse=True)
              for item in items[:8]:
                  if score(title, item.get("name", "")) < 0.84:
                      continue
                  appid = item.get("id")
                  detail = get_json(
                      f"https://store.steampowered.com/api/appdetails?appids={appid}&l=english&cc=US"
                  ).get(str(appid), {}).get("data", {})
                  if detail and score(title, detail.get("name", "")) >= 0.84:
                      # Steam header art is landscape, but is still a valid fallback image.
                      image = detail.get("header_image")
                      if image:
                          return image, "Steam Store header artwork", detail.get("name", "")
              return None

          def wiki_image(title):
              data = get_json(
                  "https://en.wikipedia.org/w/api.php?action=query&format=json&generator=search"
                  f"&gsrsearch={quote(title)}&gsrlimit=6&prop=pageimages&piprop=thumbnail&pithumbsize=1200"
              )
              pages = (data.get("query") or {}).get("pages") or {}
              ranked = sorted(pages.values(), key=lambda x: score(title, x.get("title", "")), reverse=True)
              for page in ranked:
                  thumb = (page.get("thumbnail") or {}).get("source")
                  if thumb and score(title, page.get("title", "")) >= 0.80:
                      return thumb, "Wikipedia article image", page.get("title", "")
              return None

          report = []
          html = HTML.read_text(encoding="utf-8")

          for number, title in GAMES:
              dest = OUT / f"{number}.jpg"
              row = {"number": number, "title": title, "file": str(dest), "status": "existing" if dest.exists() else "missing"}
              if not dest.exists():
                  errors = []
                  found = None
                  # Grid artwork first; exact-title Steam match second; Wikipedia last.
                  for source in (steamgriddb_image, steam_image, wiki_image):
                      try:
                          found = source(title)
                          if found:
                              break
                      except Exception as e:
                          errors.append(f"{source.__name__}: {str(e)[:180]}")
                  if found:
                      url, source_name, matched = found
                      try:
                          download(url, dest)
                          row.update(status="downloaded", source=source_name, matched_title=matched)
                      except Exception as e:
                          row["status"] = "missing"
                          errors.append("download: " + str(e)[:180])
                  row["errors"] = errors
              report.append(row)
              print(f"{number}: {row['status']} - {title}")
              time.sleep(0.6)

          # Add an image element to each target card, preserving its existing fallback.
          # 115 already has an image element in RAF-VX 12.1.9; it is left untouched.
          connected = []
          for number, title in GAMES:
              if number == 115:
                  continue
              marker = re.compile(
                  rf'(<!--\s*{number}\s*-->\s*<div class="game-card"[^>]*>.*?'
                  rf'<div class="game-title-box game-cover-box">)(.*?)(</div>)',
                  re.S
              )
              match = marker.search(html)
              if not match:
                  print(f"WARNING: card #{number} was not found; no HTML change for it.")
                  continue
              inner = match.group(2)
              img_src = f"images/games/{number}.jpg"
              if re.search(r'<img\b[^>]*class=["\'][^"\']*game-cover-img', inner):
                  connected.append(number)
                  continue
              img = (
                  f'<img class="game-cover-img" src="{img_src}" '
                  f'alt="غلاف {title}" loading="lazy" decoding="async" '
                  f'onerror="this.hidden=true;this.nextElementSibling.hidden=false">'
              )
              # Keep the existing branded fallback and reveal it if the file is unavailable.
              fallback = re.search(r'<span class="game-cover-fallback"(?:\s+hidden)?', inner)
              if fallback:
                  old = fallback.group(0)
                  if "hidden" not in old:
                      inner = inner.replace(old, old + ' hidden', 1)
                  inner = img + inner
              else:
                  inner = img + (
                      f'<span class="game-cover-fallback" hidden>'
                      f'<span class="game-logo-text">{title}</span>'
                      f'<span class="game-logo-sub">RAF-VX</span></span>'
                  ) + inner
              html = html[:match.start(2)] + inner + html[match.end(2):]
              connected.append(number)

          HTML.write_text(html, encoding="utf-8")
          Path("images/games/covers-115-126-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("Connected image elements in cards:", connected)
          PY

      - name: Commit images, report, and updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html images/games/covers-115-126-report.json
          for number in 115 116 117 118 119 120 121 122 123 124 125 126; do
            file="images/games/${number}.jpg"
            if [ -f "$file" ]; then
              git add -- "$file"
            else
              echo "Image unavailable for #${number}; fallback remains enabled."
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Connect RAF-VX game covers 115-126"
            git push
          fi
