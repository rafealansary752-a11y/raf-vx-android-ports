name: RAF-VX - Download Original Game Covers 114 and 115

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-original-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official publisher artwork
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          python - <<'PY'
          import io
          import os
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          SOURCES = {
              "114.jpg": "https://en.bandainamcoent.eu/dragon-ball/dragon-ball-sparking-zero",
              "115.jpg": "https://www.bandainamcoent.com/games/naruto-shippuden-ultimate-ninja-storm-4",
          }

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; RAF-VX-CoverBot/1.0)",
              "Accept": "text/html,application/xhtml+xml,image/avif,image/webp,*/*",
          }

          os.makedirs("images/games", exist_ok=True)

          for filename, page_url in SOURCES.items():
              print(f"Reading official publisher page: {page_url}")
              page = requests.get(page_url, headers=headers, timeout=45)
              page.raise_for_status()
              soup = BeautifulSoup(page.text, "html.parser")

              image_url = None
              for selector in [
                  ('meta', {'property': 'og:image'}),
                  ('meta', {'name': 'twitter:image'}),
                  ('meta', {'property': 'og:image:secure_url'}),
              ]:
                  tag = soup.find(*selector)
                  if tag and tag.get("content"):
                      image_url = tag["content"].strip()
                      break

              # Naruto official page's featured artwork, used if its social metadata
              # is absent. This image is hosted by Bandai Namco's own Graphassets CDN.
              if filename == "115.jpg" and not image_url:
                  image_url = "https://us-east-1-bandai.graphassets.com/AXzioIclSWilEjFtsMJPwz/HyJQ1CCrSpjYa6dtPof9"

              if not image_url:
                  raise RuntimeError(
                      f"No official artwork URL found for {filename}. "
                      "Stopping instead of creating a fake placeholder."
                  )

              if image_url.startswith("//"):
                  image_url = "https:" + image_url
              elif image_url.startswith("/"):
                  from urllib.parse import urljoin
                  image_url = urljoin(page_url, image_url)

              print(f"Downloading artwork for {filename}: {image_url}")
              response = requests.get(image_url, headers=headers, timeout=60)
              response.raise_for_status()

              # Validate that the downloaded asset is a real image and not an HTML error page.
              image = Image.open(io.BytesIO(response.content)).convert("RGB")
              if image.width < 300 or image.height < 300:
                  raise RuntimeError(
                      f"Artwork for {filename} is too small ({image.width}x{image.height}); "
                      "refusing to publish it."
                  )

              image.save(f"images/games/{filename}", "JPEG", quality=94, optimize=True)
              print(f"Saved images/games/{filename}: {image.width}x{image.height}")

          PY

      - name: Commit original covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/games/114.jpg images/games/115.jpg
          if git diff --cached --quiet; then
            echo "The original cover images are already up to date."
            exit 0
          fi
          git commit -m "Replace placeholder covers with original game artwork 114 and 115"
          git push
