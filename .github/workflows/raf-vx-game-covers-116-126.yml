name: RAF-VX - Download Game Covers 116-126

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/raf-vx-game-covers-116-126.yml"

permissions:
  contents: write

concurrency:
  group: raf-vx-game-covers-116-126
  cancel-in-progress: false

jobs:
  download-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and download original game cover artwork
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, time, unicodedata
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from difflib import SequenceMatcher

          GAMES = [
              (116, "Divinity Original Sin 2"),
              (117, "Minecraft Dungeons II"),
              (118, "Forza Motorsport 2005"),
              (119, "Charlie Murder"),
              (120, "Hearts of Iron IV"),
              (121, "Land of the Dead: Road to Fiddler's Green"),
              (122, "Darkwatch"),
              (123, "Dark Souls 2: Scholar of the First Sin"),
              (124, "Untitled Goose Game"),
              (125, "Hamburger Hill"),
              (126, "Super Mario Strikers"),
          ]

          OUT = Path("images/games")
          OUT.mkdir(parents=True, exist_ok=True)
          REPORT = []

          def norm(s):
              s = unicodedata.normalize("NFKD", s or "")
              s = "".join(c for c in s if not unicodedata.combining(c))
              s = s.lower().replace("&", "and")
              return re.sub(r"[^a-z0-9]+", " ", s).strip()

          def get_json(url, headers=None):
              h = {"User-Agent": "RAF-VX-CoverBot/1.0 (GitHub Actions)"}
              if headers:
                  h.update(headers)
              req = Request(url, headers=h)
              with urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          def download(url, dest):
              req = Request(url, headers={"User-Agent": "RAF-VX-CoverBot/1.0"})
              with urlopen(req, timeout=40) as r:
                  data = r.read()
                  ctype = r.headers.get("Content-Type", "").lower()
              if len(data) < 8000 or not (data.startswith(b"\xff\xd8") or data.startswith(b"\x89PNG") or data[:4] == b"RIFF"):
                  raise ValueError("The returned file is not a valid image")
              if "html" in ctype:
                  raise ValueError("The source returned HTML, not an image")
              dest.write_bytes(data)

          def wiki_image(title):
              # Wikipedia API: search for the game's article, then request its official page thumbnail.
              q = quote(title)
              data = get_json(
                  "https://en.wikipedia.org/w/api.php?action=query&format=json&generator=search"
                  f"&gsrsearch={q}&gsrlimit=5&prop=pageimages&piprop=thumbnail&pithumbsize=1200"
              )
              pages = (data.get("query") or {}).get("pages") or {}
              ranked = sorted(
                  pages.values(),
                  key=lambda x: SequenceMatcher(None, norm(title), norm(x.get("title", ""))).ratio(),
                  reverse=True
              )
              for page in ranked:
                  score = SequenceMatcher(None, norm(title), norm(page.get("title", ""))).ratio()
                  thumb = (page.get("thumbnail") or {}).get("source")
                  if thumb and score >= 0.78:
                      return thumb, "Wikipedia page image", page.get("title")
              return None

          def commons_image(title):
              data = get_json(
                  "https://commons.wikimedia.org/w/api.php?action=query&format=json"
                  f"&generator=search&gsrsearch={quote(title + ' video game cover')}"
                  "&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=1200"
              )
              pages = (data.get("query") or {}).get("pages") or {}
              for page in pages.values():
                  name = page.get("title", "")
                  score = SequenceMatcher(None, norm(title), norm(name)).ratio()
                  info = (page.get("imageinfo") or [{}])[0]
                  url = info.get("thumburl") or info.get("url")
                  # Only accept filenames that identify the exact game title reasonably well.
                  if url and score >= 0.62:
                      return url, "Wikimedia Commons", name
              return None

          def steam_image(title):
              data = get_json("https://store.steampowered.com/api/storesearch/?term=" + quote(title) + "&l=english&cc=US")
              items = data.get("items") or []
              for item in items[:8]:
                  score = SequenceMatcher(None, norm(title), norm(item.get("name", ""))).ratio()
                  if score >= 0.82:
                      appid = item.get("id")
                      detail = get_json(
                          f"https://store.steampowered.com/api/appdetails?appids={appid}&l=english&cc=US"
                      ).get(str(appid), {}).get("data", {})
                      if detail and SequenceMatcher(None, norm(title), norm(detail.get("name", ""))).ratio() >= 0.82:
                          image = detail.get("header_image")
                          if image:
                              return image, "Steam Store", detail.get("name")
              return None

          def steamgriddb_image(title):
              key = os.environ.get("STEAMGRIDDB_API_KEY")
              if not key:
                  return None
              data = get_json(
                  "https://www.steamgriddb.com/api/v2/search/autocomplete/" + quote(title),
                  {"Authorization": "Bearer " + key}
              )
              for item in data.get("data", [])[:5]:
                  score = SequenceMatcher(None, norm(title), norm(item.get("name", ""))).ratio()
                  if score >= 0.82:
                      imgs = get_json(
                          f"https://www.steamgriddb.com/api/v2/grids/game/{item['id']}",
                          {"Authorization": "Bearer " + key}
                      ).get("data", [])
                      for img in imgs:
                          if img.get("url"):
                              return img["url"], "SteamGridDB (API)", item.get("name")
              return None

          for number, title in GAMES:
              dest = OUT / f"{number}.jpg"
              result = None
              errors = []
              for source in (wiki_image, commons_image, steam_image, steamgriddb_image):
                  try:
                      result = source(title)
                      if result:
                          break
                  except Exception as e:
                      errors.append(f"{source.__name__}: {str(e)[:160]}")
              row = {"number": number, "title": title, "file": str(dest), "status": "missing"}
              if result:
                  url, source_name, matched_title = result
                  try:
                      download(url, dest)
                      row.update(status="downloaded", source=source_name, matched_title=matched_title, source_url=url)
                  except Exception as e:
                      row["errors"] = errors + [f"download: {str(e)[:200]}"]
              else:
                  row["errors"] = errors
              REPORT.append(row)
              print(f"{number}: {row['status']} - {title}")
              time.sleep(0.5)

          Path("images/games/covers-116-126-report.json").write_text(
              json.dumps(REPORT, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          downloaded = sum(x["status"] == "downloaded" for x in REPORT)
          print(f"Downloaded {downloaded}/{len(GAMES)} covers.")
          PY

      - name: Commit downloaded covers and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/games/116.jpg images/games/117.jpg images/games/118.jpg images/games/119.jpg images/games/120.jpg images/games/121.jpg images/games/122.jpg images/games/123.jpg images/games/124.jpg images/games/125.jpg images/games/126.jpg images/games/covers-116-126-report.json
          if git diff --cached --quiet; then
            echo "No new cover files to commit."
          else
            git commit -m "Add game cover images 116-126"
            git push
          fi
