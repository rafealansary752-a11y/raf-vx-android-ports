name: RAF-VX Original Covers 107 and 108

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raf-vx-original-covers-107-108
  cancel-in-progress: false

jobs:
  original-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout RAF-VX
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required Python packages
        run: python -m pip install --upgrade requests pillow beautifulsoup4

      - name: Download and install exact game covers
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import os
          import requests
          from PIL import Image
          from bs4 import BeautifulSoup

          ROOT = Path.cwd()
          HTML = ROOT / "index.html"
          OUT = ROOT / "images" / "games"

          # Exact Steam app IDs, checked against the games' Steam records.
          TARGETS = {
              107: ("Aura Farming", 4754800),
              108: ("Rodland of Pipes", 3125120),
          }

          if not HTML.is_file():
              raise SystemExit("ERROR: index.html was not found.")

          soup = BeautifulSoup(HTML.read_text(encoding="utf-8"), "html.parser")
          cards = soup.select(".game-card")
          if len(cards) < 108:
              raise SystemExit(
                  f"ERROR: expected at least 108 .game-card elements, found {len(cards)}. "
                  "Nothing was changed."
              )

          OUT.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; RAF-VX-Cover-Importer/1.0)"
          })

          added = []
          errors = []

          for number, (title, appid) in TARGETS.items():
              try:
                  card = cards[number - 1]
                  box = card.select_one(".game-title-box")
                  if box is None:
                      raise RuntimeError("game cover container .game-title-box was not found")

                  # Try current Steam asset host first, then the established public CDN hosts.
                  urls = [
                      f"https://shared.steamstatic.com/store_item_assets/steam/apps/{appid}/library_600x900.jpg",
                      f"https://cdn.akamai.steamstatic.com/steam/apps/{appid}/library_600x900.jpg",
                      f"https://cdn.cloudflare.steamstatic.com/steam/apps/{appid}/library_600x900.jpg",
                  ]

                  image_data = None
                  successful_url = None
                  failures = []

                  for url in urls:
                      try:
                          response = session.get(url, timeout=35)
                          response.raise_for_status()
                          data = response.content
                          if not data or len(data) > 15 * 1024 * 1024:
                              raise RuntimeError("empty image or image larger than 15 MB")

                          im = Image.open(BytesIO(data))
                          im.verify()
                          im = Image.open(BytesIO(data))
                          width, height = im.size

                          # Require a real portrait library cover, not an HTML error or banner.
                          if width < 250 or height < 350 or height <= width:
                              raise RuntimeError(f"not a portrait cover ({width}x{height})")

                          image_data = data
                          successful_url = url
                          break
                      except Exception as exc:
                          failures.append(f"{url} -> {type(exc).__name__}: {exc}")

                  if image_data is None:
                      raise RuntimeError("No valid official portrait cover found. " + " | ".join(failures))

                  # Save the original image bytes; do not redraw or replace the game's artwork.
                  target = OUT / f"{number:03d}.jpg"
                  target.write_bytes(image_data)

                  img = box.select_one("img.game-cover-img")
                  if img is None:
                      img = soup.new_tag(
                          "img",
                          **{
                              "class": "game-cover-img",
                              "loading": "lazy",
                              "decoding": "async",
                          }
                      )
                      box.clear()
                      box.append(img)

                  img["src"] = f"images/games/{number:03d}.jpg"
                  img["alt"] = title
                  current_classes = box.get("class", [])
                  if "has-cover" not in current_classes:
                      current_classes.append("has-cover")
                  box["class"] = current_classes

                  added.append(
                      f"#{number} {title}: downloaded original Steam artwork "
                      f"({width}x{height}) from {successful_url}"
                  )

              except Exception as exc:
                  errors.append(f"#{number} {title}: {type(exc).__name__}: {exc}")

          # Save HTML only if at least one target image was successfully installed.
          if added:
              HTML.write_text(str(soup), encoding="utf-8")

          report = [
              "### RAF-VX original covers 107–108",
              f"Successfully installed: {len(added)} / 2",
              f"Errors: {len(errors)}",
              "",
              "### Installed",
              *["- " + item for item in added],
              "",
              "### Errors",
              *["- " + item for item in errors],
              "",
              "Only game cards 107 and 108 are targeted. Game 90 and all other cards are untouched."
          ]

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(report) + "\n")

          print("\n".join(report))

          if errors:
              raise SystemExit("One or more original covers could not be downloaded; see report above.")
          PY

      - name: Commit only the two cover files and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/games/107.jpg images/games/108.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add original Steam covers for games 107 and 108"
            git push
          fi
